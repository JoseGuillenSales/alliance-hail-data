# Updates the radar hail paths every morning and publishes data/ with GitHub Pages.
# Run it by hand from the Actions tab to re-process days ("dates") or a range.
name: Daily hail paths

on:
  schedule:
    - cron: "30 10 * * *" # 4:30 am MDT / 3:30 am MST, after the Colorado day's radar file is out
  workflow_dispatch:
    inputs:
      dates:
        description: "Re-process these days (YYYY-MM-DD, space-separated). Leave empty for the normal daily run."
        required: false
      range:
        description: "Or a range, first and last day (e.g. 2024-11-18 2026-11-17)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hail-paths
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Process radar
        env:
          DATES: ${{ github.event.inputs.dates }}
          RANGE: ${{ github.event.inputs.range }}
        run: |
          if [ -n "$DATES" ]; then python -m engine --out data day $DATES
          elif [ -n "$RANGE" ]; then python -m engine --out data range $RANGE
          else python -m engine --out data daily
          fi

      - name: Save the new files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Hail paths updated $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: data

      - id: deploy
        uses: actions/deploy-pages@v4

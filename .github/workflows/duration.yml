# How long radar showed 1-inch hail on each hail day, and when (engine/duration.py),
# published with GitHub Pages next to the hail and wind files. Runs after the hail job
# (which decides which days are hail days). The first runs also fill in the history,
# newest first, stopping new days after DURATION_TIME_BUDGET_MINUTES.
# Run it by hand from the Actions tab to re-process days ("dates").
name: Daily hail duration

on:
  push:
    branches: [main]
    paths:
      - "engine/duration.py"
      - ".github/workflows/duration.yml"
  schedule:
    - cron: "15 12 * * *" # 6:15 am MDT / 5:15 am MST, after the hail job
  workflow_dispatch:
    inputs:
      dates:
        description: "Re-process these hail days (YYYY-MM-DD, space-separated). Leave empty for the normal daily run."
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hail-paths # shared with the hail and wind jobs, so they never push at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Process hail duration
        env:
          DATES: ${{ github.event.inputs.dates }}
        run: |
          if [ -n "$DATES" ]; then python -m engine.duration --out data/duration day $DATES
          else python -m engine.duration --out data/duration --workers 4 daily
          fi

      - name: Save the new files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duration
          git diff --cached --quiet || git commit -m "Hail duration updated $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: data

      - id: deploy
        uses: actions/deploy-pages@v4
